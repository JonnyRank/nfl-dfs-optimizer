[project]
name = "nfl-dfs-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonnyRank", email = "jonathandrankin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.15.1",
    "pandas>=3.0.6",
    "pulp>=3.3.2",
    "tzdata>=2026.4",
]

[project.scripts]
nfl-dfs-optimizer = "nfl_dfs_optimizer:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
# Vendored Claude Code skill scripts aren't project code.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
